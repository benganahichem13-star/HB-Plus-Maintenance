name: Build HB+ Maintenance APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web assets into www
        run: |
          mkdir -p www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' ./ www/

      - name: Initialize Capacitor Android if needed
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          if [ ! -d android ]; then
            npx cap init "HB+ Maintenance" "com.hb.maintenance" --web-dir=www
            npx cap add android
          fi
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HB-Maintenance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
